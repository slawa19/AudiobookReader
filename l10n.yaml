# Interface strings: lib/screens/l10n/app_<language>.arb; the classes are generated by `flutter gen-l10n` (part of the
# Flutter tool, runs by itself on `flutter pub get`, `flutter test`, `flutter build`). The only permitted
# exception to the "no code generation" rule (ARCHITECTURE.md, sections 8 and 10).
arb-dir: lib/screens/l10n
template-arb-file: app_ru.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/screens/l10n
nullable-getter: false
preferred-supported-locales: [en, ru, pl, de, uk]
