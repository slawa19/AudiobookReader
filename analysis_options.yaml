include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - web/**
    # Generated by `flutter gen-l10n` from the ARB files (l10n.yaml); edit the ARB, not these files.
    - lib/screens/l10n/app_localizations*.dart
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - prefer_final_locals
    - avoid_print
    - sort_child_properties_last
    - use_super_parameters
