name: audiobook_reader
description: "Android book reader that reads aloud with Google Gemini TTS voices."
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.14.0
  flutter: 3.50.0

# Versions are pinned exactly. Flutter: scripts/env.sh.
dependencies:
  flutter:
    sdk: flutter
  material_ui: 1.11.0
  # Localization: ARB + gen-l10n (l10n.yaml). Material system labels come from GlobalMaterialLocalizations in
  # material_ui; flutter_localizations is needed by the generated strings class.
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  archive: 4.7.1
  crypto: 3.0.8
  path_provider: 2.1.6
  flutter_secure_storage: 11.2.0
  http: 1.6.0
  just_audio: 0.10.6
  audio_service: 0.18.19
  audio_session: 0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/demo/
    - assets/demo/images/
    - assets/demo/covers/
    # License texts shown on the in-app license page (lib/screens/licenses.dart).
    - LICENSE
    - assets/fonts/Merriweather-OFL.txt
    - assets/fonts/Roboto-OFL.txt

  fonts:
    # Book text and book titles. OFL, source: assets/fonts/SOURCES.txt.
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf
        - asset: assets/fonts/Merriweather-Italic.ttf
          style: italic
        - asset: assets/fonts/Merriweather-Bold.ttf
          weight: 700
        - asset: assets/fonts/Merriweather-BoldItalic.ttf
          weight: 700
          style: italic
    # Interface. On Android this is the system font; bundled so that the web prototype and test goldens
    # look like the phone and do not fetch the font over the network.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
