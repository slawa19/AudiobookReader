name: Release

# A push of a vX.Y.Z tag builds the release APK, signs it with the permanent key from GitHub Secrets, verifies the
# signature, and publishes the APK, NOTICES.txt (extracted from the APK) and SHA256SUMS, with a build-provenance
# attestation of the APK, in GitHub Releases.
# Manual run (workflow_dispatch) with dry_run=true builds and uploads the APK as a workflow artifact only: no release,
# no attestation. How to set up and cut a release: docs/RELEASING.md.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and upload the APK as a workflow artifact, but create no release and no attestation"
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write       # create the GitHub Release
      id-token: write       # the OIDC token the attestation is signed with
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0    # the full history and origin/main, for the check that the tagged commit is on main

      # Decides between a real release and a dry run, and checks the tag against pubspec.yaml before any build time
      # is spent. Values from the event reach the script only through env, never through ${{ }} inside the script.
      - name: Mode and version
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release=false
          if [[ "${EVENT}" == push ]]; then
            release=true
          elif [[ "${DRY_RUN}" == false ]]; then
            if [[ "${REF_TYPE}" != tag ]]; then
              echo "::error::A release is cut from a tag. Run the workflow on a vX.Y.Z tag, or set dry_run=true."
              exit 1
            fi
            release=true
          fi

          version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n1)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot read an X.Y.Z version name from pubspec.yaml (got '${version}')."
            exit 1
          fi
          if [[ "${REF_TYPE}" == tag && "${REF_NAME}" != "v${version}" ]]; then
            echo "::error::The tag ${REF_NAME} does not match the version name ${version} in pubspec.yaml."
            exit 1
          fi
          if [[ "${release}" == true ]] && gh release view "${REF_NAME}" >/dev/null 2>&1; then
            echo "::error::A release for ${REF_NAME} already exists."
            exit 1
          fi

          echo "release=${release}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "apk=BookAudioReader-${version}.apk" >> "${GITHUB_OUTPUT}"
          echo "Version ${version}, release=${release}"

      # A release is cut only from a commit that is already on main: a version tag on a commit of another branch fails
      # here, before any secret is read. A dry run may run on any branch (docs/RELEASING.md, "Dry run").
      - name: The tagged commit is on main
        if: steps.meta.outputs.release == 'true'
        run: |
          if ! git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null; then
            echo "::error::origin/main is missing from the checkout, so the tagged commit cannot be checked."
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "${commit}" refs/remotes/origin/main; then
            echo "::error::The tagged commit ${commit} is not on main. Merge it into main and tag a commit of main."
            exit 1
          fi
          echo "The tagged commit ${commit} is on main."

      # The runner arrives almost full: the SDK and NDK need space (found 2026-11-15, see ci.yml).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: Flutter 3.50.0, JDK and Android SDK
        run: bash scripts/setup-wsl.sh

      # A release is never cut from a red tree. No signing secrets exist in the environment of this step.
      - name: Analyzer and tests
        run: bash scripts/test.sh

      # The keystore lives only under RUNNER_TEMP, never in the workspace, and is removed in the always() step below.
      - name: Restore the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set +x
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::The secret ANDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          keystore="${RUNNER_TEMP}/release.jks"
          umask 077
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${keystore}"
          echo "KEYSTORE_FILE=${keystore}" >> "${GITHUB_ENV}"

      # build-apk.sh takes the four ANDROID_KEY* values from the environment when they are all present.
      - name: Build the release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +x
          bash scripts/build-apk.sh

      - name: Delete the keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"

      # The APK must be signed by the permanent key: the certificate SHA-256 must equal the repository variable
      # SIGNING_CERT_SHA256, which docs/RELEASING.md publishes for users.
      - name: Verify the signature
        env:
          EXPECTED: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          source scripts/env.sh
          apk="build/app/outputs/flutter-apk/app-real-release.apk"
          expected="$(printf '%s' "${EXPECTED}" | tr -d ': \r\n' | tr 'A-F' 'a-f')"
          if [[ ! "${expected}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The repository variable SIGNING_CERT_SHA256 is missing or is not a SHA-256 fingerprint."
            exit 1
          fi
          "${APKSIGNER}" verify --print-certs "${apk}" | tee "${RUNNER_TEMP}/certs.txt"
          mapfile -t actual < <(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' "${RUNNER_TEMP}/certs.txt")
          if (( ${#actual[@]} != 1 )); then
            echo "::error::Expected exactly one signer, found ${#actual[@]}."
            exit 1
          fi
          if [[ "${actual[0]}" != "${expected}" ]]; then
            echo "::error::The signing certificate ${actual[0]} differs from the expected ${expected}."
            exit 1
          fi
          echo "Signing certificate matches: ${actual[0]}"

      # NOTICES.txt is the notices file the Flutter tool bundled into the APK (the app, the fonts, the demo texts, every
      # pub package and the engine), extracted from the very APK that is published, so the attached file is the
      # complete list actually shipped. It is listed in SHA256SUMS like the APK.
      - name: Name the assets and write SHA256SUMS
        env:
          APK_NAME: ${{ steps.meta.outputs.apk }}
        run: |
          mkdir dist
          cp build/app/outputs/flutter-apk/app-real-release.apk "dist/${APK_NAME}"
          unzip -p "dist/${APK_NAME}" assets/flutter_assets/NOTICES.Z | gunzip > dist/NOTICES.txt
          if [[ ! -s dist/NOTICES.txt ]] || ! grep -q 'Book AudioReader' dist/NOTICES.txt; then
            echo "::error::NOTICES.txt extracted from the APK is empty or does not name the app."
            exit 1
          fi
          (cd dist && sha256sum "${APK_NAME}" NOTICES.txt > SHA256SUMS && cat SHA256SUMS)

      - name: Upload the APK (dry run)
        if: steps.meta.outputs.release != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.apk }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

      - name: Attest the build provenance
        if: steps.meta.outputs.release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ steps.meta.outputs.apk }}

      - name: Create the GitHub Release
        if: steps.meta.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK_NAME: ${{ steps.meta.outputs.apk }}
        run: |
          gh release create "${TAG}" "dist/${APK_NAME}" dist/NOTICES.txt dist/SHA256SUMS \
            --title "${TAG}" --generate-notes --verify-tag
