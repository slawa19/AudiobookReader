name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner arrives almost full: our own SDK and NDK left the build without space ("No space left on device",
      # found 2026-11-15). The preinstalled Android SDK, .NET, GHC and Docker images are not needed.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      # The Flutter version and archive checksums come from scripts/env.sh, as they do locally.
      - name: Flutter 3.50.0, JDK and Android SDK
        run: bash scripts/setup-wsl.sh
      - name: Analyzer and tests
        run: bash scripts/test.sh
      - name: APK with debug signing
        run: bash scripts/build-apk.sh --debug
      # Sequentially: the second variant reuses the Gradle dependencies already built.
      - name: Fake APK with debug signing
        run: bash scripts/build-apk.sh --debug --fake
